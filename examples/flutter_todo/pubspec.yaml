name: flutter_todo
description: Flutter sample that persists a TODO list with Dartonic + sqlite.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  dartonic_core:
    path: ../../dartonic_core
  dartonic_sqlite:
    path: ../../dartonic_sqlite
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/migrations/
