name: relations_blog
description: Example showing Dartonic table relations (FK, 1-1, 1-N, N-1, N-N) over a darto HTTP API with zard validation.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  darto: ^1.2.0
  darto_inject: ^1.0.0
  zard: ^1.1.2
  dartonic_core:
    path: ../../dartonic_core
  dartonic_sqlite:
    path: ../../dartonic_sqlite

dev_dependencies:
  lints: ^6.0.0
