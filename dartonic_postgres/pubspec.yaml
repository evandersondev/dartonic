name: dartonic_postgres
publish_to: none
description: PostgreSQL driver for Dartonic. Provides connectPostgres() to create a type-safe database connection.
version: 1.0.0
homepage: https://github.com/evandersondev/dartonic

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  dartonic_core:
    path: ../dartonic_core
  postgres: ^3.5.4

dev_dependencies:
  lints: ^5.0.0
  test: ^1.24.0
